# ============================================================
#  vrcnotifier CI: 测试(PR / 手动 / 被 release.yml 复用)
#
#  矩阵两档:
#    22.13.0  package.json engines 声明的最低版本(生产镜像 node:22-alpine 恒 >= 它,
#             所以这一档是对 22 线更严格的覆盖)
#    24.x     本地开发版本(README 推荐)
#
#  测试用 Node 内置 node:test + node:sqlite, 没有 devDependencies, 故 npm ci 即可。
#  注意: 项目里的等待普遍用 unref 定时器(生产有 HTTP server 保活), 测试脚手架需自备
#  ref'd 定时器托住事件循环 —— 否则 Node 22 的 test runner 会判定「Promise 仍待决」并
#  取消整个测试文件(详见各 test/*.test.js 顶部的说明)。
# ============================================================
name: Test

on:
  # 注意: 这里**故意不挂 push: branches [main]**。
  # push 到 main 时 release.yml 已用 workflow_call 复用本文件 —— 若这里也挂 push, 同一次 push 会产生
  # 两条 run, 它们落进同一个并发组(见下面 concurrency 的 group), 而 cancel-in-progress 会把先到的那条
  # 直接取消: Actions 里表现为 Test 工作流一个红叉, 注解原文
  #   "Canceling since a higher priority waiting request for test-refs/heads/main exists"
  # 让人误以为测试挂了, 其实测试根本没跑(真正跑的是 release.yml 里那次复用调用)。
  # 所以 push 到 main 的测试入口只有 release.yml 一处, 不重复触发、不浪费 runner。
  pull_request:
  workflow_dispatch:
  # 被 release.yml 复用(workflow_call): 测试定义只此一份, 发版那条流水线不复制粘贴
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
