    background: #0d1117; color: #c9d1d9;
    font: 15px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .box { max-width: 640px; padding: 0 28px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; color: #e6edf3; }
  p { margin: 0 0 18px; color: #8b949e; }
  a {
    display: inline-block; padding: 9px 18px; border-radius: 8px;

<body>
<div class="box">
  <h1>VRChat 好友监控通知器 · 结构图</h1>
  <p>正在打开结构图……如果没有自动跳转，点下面的按钮。</p>
