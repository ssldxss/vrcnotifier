        "en": "Boot Self-check & Key Validation"
      },
      "description": {
        "zh": "打开数据库前解析主密钥（Docker Secret → MASTER_KEY → --no-encrypt），随后用当前密钥探测敏感密文是否可解：不可解则清空除访问令牌外的全部数据、删除头像缓存并以退出码 0 结束，交给容器策略重启。\n",
        "en": "Resolves the master key (Docker Secret, then MASTER_KEY, then --no-encrypt) before opening the database, then probes whether existing sensitive ciphertext decrypts with it: if not, it wipes everything except the access token, removes the avatar cache and exits with code 0 so the container policy restarts it.\n"
      },

          "key": "rpc:startupResolveKey(opts)"

          },
          "key": "rpc:startupSelfCheck(db, crypt, logger)"
        }

        {

          "to": "vrcnotifier.data.crypto-fields",
          "label": {

          },
          "cross_tree": false
        }
      ],

      "name": {
        "zh": "世界名与群组名缓存",
        "en": "World & Group Name Caches"
      },
      "description": {
        "zh": "两个刻意不对称的小缓存。世界名缓存只存成功解析到的名字，失败冷却记在内存，因此其失败相关列在迁移中被删除，启动时也会清理占位行以免被当成真名字。群组名缓存仍保留失败计数与重试时间，因为群组查询把退避状态存在库里。\n",
        "en": "Two small caches that are not symmetric on purpose. The world cache stores only successful resolutions and keeps failure cooldown in memory, so its failure columns were dropped in a migration and placeholder rows were purged at startup to stop them being mistaken for real names. The group cache still carries a failure count and a retry time because group lookups keep that backoff in the database.\n"
      },

    "vrcnotifier.data.crypto-fields": {

      "name": {
        "zh": "敏感字段加密与清库",
        "en": "Encrypted Fields & Wipe"
      },
      "description": {
        "zh": "仓储层唯一的加密语义所有者。读取时用把值绑定到行身份的 AAD 解密用户敏感列，从而防止密文在行之间被置换。探测接口报告是否存在用当前密钥解不开的密文，启动流程据此静默清库并重启。清库在事务中执行且刻意保留访问令牌，否则面板会被一次自己并未要求过的密钥轮换锁在门外。\n",
        "en": "The repository's only owner of encryption semantics. Reads decrypt the sensitive user columns with an AAD that binds each value to its row identity, which prevents a ciphertext from being swapped between rows. A probe reports whether any stored ciphertext fails to decrypt under the current key, and the startup flow turns that into a silent wipe and restart. Wiping is transactional and keeps the access token, otherwise the panel would be locked out by a rotation it never asked for.\n"
      },

      "name": {
        "zh": "通知去重窗口",
        "en": "Notification Dedupe Window"
      },
      "description": {
        "zh": "按复合字符串键的时间窗口去重表。写入键会刷新其时间戳，并在表超过上限后按时间裁剪最旧的行，因此无需后台任务即可保持有界。窗口由调用方传入，使好友变更与站内通知能复用同一机制而各用各的键与宽容度。\n",
        "en": "A time-window dedupe table keyed by a composite string. Marking a key refreshes its timestamp and then trims the oldest rows once the table exceeds its cap, so the table stays bounded without a background job. The window is supplied by the caller, which lets friend changes and in-app notifications reuse the same mechanism with different keys and different tolerances.\n"
      },

    "vrcnotifier.data.friend-state.apply": {
      "uid": "6a03bb99",
      "id": "vrcnotifier.data.friend-state.apply",

      "depth": 4,
      "name": {
        "zh": "待确认阶梯与变更负载",
        "en": "Pending Confirmation & Change Payload"
      },
      "description": {
        "zh": "待确认阶梯是这个模块真正的价值所在。入参字段为 undefined 表示保留旧值，显式 null 才有含义。怀疑下线不会立刻通知：先记录 pending 状态与时间戳，抖回在线则静默取消，窗口后再次到达该状态才确认，而变成另一个非在线状态只是改指目标并重新计时。世界名永不入库，因为它住在世界名缓存里。\n",
        "en": "The pending-confirmation ladder, the real value here. An undefined incoming field keeps the stored value while an explicit null is meaningful. A suspected offline does not notify immediately: it arms a pending state with a timestamp, a bounce back to online cancels it silently, a return to that state after the window confirms it, and a move to another non-online state retargets and restarts the clock. World names are never persisted.\n"
      },

      "depth": 4,
      "name": {
        "zh": "在线状态派生",
        "en": "Presence State Derivation"
      },
      "description": {
        "zh": "带明确优先级的在线状态派生。有快照时以三个状态数组为准，因为它们比好友行上的 location 字段更准；只有三个数组都没提到该好友时才由位置字符串决定。基于位置的兜底把 private、traveling 与 wrld_ 前缀视为在线，其余一律离线，这是刻意保守的选择。\n",
        "en": "Presence derivation with an explicit priority order. When a snapshot is available its three status arrays are authoritative because they are more accurate than a friend's location field; only when none of them mention the friend does the location string decide. The location-based fallback treats private, traveling and world-prefixed tags as online and everything else as offline, which is intentionally conservative.\n"
      },

          },

      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "状态转移分类",
        "en": "Transition Classification"
      },
      "description": {
        "zh": "把一对在线状态翻译成意图。它覆盖了真正会被在意的情形：进游戏算上线，只上网页算较轻的上线，而退出游戏但网页仍在线同样算下线。世界编号变化总按切换世界上报，private 或未知来源也一样；游戏在线时四种社交状态与自由文本的自定义状态各映射为一种报告。网页登出刻意静默不报。\n",
        "en": "Turns a pair of presence states into intent. It knows the cases people actually care about: entering the game is an arrival, entering only the web is a milder arrival, and leaving the game while staying on the web still counts as going offline. A world id change always reports as a world switch even for private or unknown origins, and within the game the four social statuses plus the free-text custom status each map to a distinct report. Web logout is deliberately silent.\n"
      },

      "name": {
        "zh": "好友行与状态写入",
        "en": "Friend Rows & State Writes"
      },
      "description": {
        "zh": "friends 表是全局的而非按账号划分，因为同一时间只跑一个 VRChat 账号。upsert 对资料字段做 COALESCE，使稀疏负载不会把已存头像清空，并返回该行是否为新行以便调用方处理首见逻辑。状态写入接收 snake_case 字段，因为调用方直接展开状态机的 dbUpdate——这是与 camelCase 的自身状态写入有意保留的不对称。\n",
        "en": "The friends table, which is global rather than per-account because only one VRChat account runs at a time. Upserts coalesce profile fields so a sparse payload does not blank a stored avatar, and return whether the row was new so the caller can decide about first-seen handling. The state writer takes snake_case fields because callers spread the state machine's dbUpdate straight in, an intentional asymmetry with the camelCase self-presence writer.\n"
      },

        "zh": "解析 VRChat 的 location 标签形状 world:instance~flag(value)。它把世界 id 与实例后缀分开，识别表示并非真实实例的哨兵值，并收集无值标志与键值参数，使调用方能推断实例属性。便捷谓词回答调用方最常问的那一个问题：这个标签背后是否真有世界。\n",
        "en": "Parses the VRChat location tag shape world:instance~flag(value). It separates the world id from the instance suffix, recognizes the sentinel values that mean no real instance, and collects both valueless flags and keyed parameters so callers can reason about instance properties. The convenience predicate answers the one question most callers actually have, namely whether there is a real world behind this tag.\n"

      "description": {
        "zh": "按归属划分的销毁路径。登出总会清除属于该 VRChat 账号的一切，因为它们对下一个账号毫无意义；清缓存与清设置是在此之上的两个独立选项。清设置同样保留访问令牌，理由与清库一致；所有路径都返回计数，使面板能如实报告实际删除了什么，而不是想当然。\n",
        "en": "Destruction paths grouped by ownership. Logout always clears everything that belongs to the VRChat account, because none of it means anything for the next account; clearing caches and clearing settings are separate opt-ins on top of that. Settings clearing keeps the access token for the same reason the wipe does, and every path returns counts so the panel can report what was actually removed rather than assuming.\n"
      },

      },
      "description": {
        "zh": "带类型白名单的全局键值设置：未知键在读写两侧都被忽略，整数截断后以字符串存储，QQ AppSecret 用固定 AAD 加密。两个启动迁移把历史通知列从 users 表搬出（取最新行的值且不覆盖已存在的键），并把旧版本存成带小数点的整数值归一。裸读写接口刻意绕过白名单，供访问令牌等内部键使用。\n",
        "en": "Global key/value settings behind a typed whitelist: unknown keys are ignored on both write and read, integers are truncated and stored as strings, and the QQ app secret is encrypted with a fixed AAD. Two startup migrations move historical notification columns out of the users table (taking the newest row's values and never overwriting an existing key) and normalize integer values that older builds stored with a decimal point. The raw accessors deliberately skip the whitelist for internal keys.\n"
      },

        "zh": "users 表及其凭据策略。凭据刻意保持全局唯一：保存 cookie jar 会清掉其他行的 cookie、保存的用户名与记住我标志，因为同一时间只监控一个 VRChat 账号。所有敏感写入都经注入的加密器，且 AAD 把值绑定到所在行身份；所有读取路径都会解密，因此解不开的字段表现为 null 而不是乱码。\n",
        "en": "The users table and its credential policy. Credentials are deliberately global: saving a cookie jar clears every other row's cookies, saved username and remember-me flag, because only one VRChat account is monitored at a time. Every sensitive write goes through the injected crypto with an AAD binding the value to its row identity, and every read path decrypts, so an undecryptable field surfaces as null rather than corrupt text.\n"
      },

    "vrcnotifier.infra.avatar": {
      "uid": "55aea68a",
      "id": "vrcnotifier.infra.avatar",
      "parent": "vrcnotifier.infra",
      "tree": "vrcnotifier",
      "depth": 3,
      "name": {
        "zh": "头像缓存",
        "en": "Avatar Cache"
      },
      "description": {
        "zh": "头像缓存，其核心想法是“文件系统即索引”：文件存在即命中，其修改时间即最后访问时间，无需建表。它只回答本地有没有、要不要去上游取；发字节是 HTTP 层的事。\n",
        "en": "The avatar cache, whose guiding idea is that the filesystem is the index: a file existing means a cache hit, its modification time is the last access time, and no table is needed. It answers only whether an image is local and whether to fetch it; sending bytes is the HTTP layer's job.\n"
      },
      "source": [

    "vrcnotifier.infra.avatar.maintenance": {
      "uid": "26166ece",
      "id": "vrcnotifier.infra.avatar.maintenance",
      "parent": "vrcnotifier.infra.avatar",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "缓存清理与淘汰",
        "en": "Cache Sweeping & Eviction"
      },
      "description": {
        "zh": "让缓存不会无限增长，用修改时间同时充当 TTL 时钟与访问新鲜度。文件数上限只在下载之后检查，且先做一次目录列举即短路，因此昂贵的逐项 stat 排序只在真正超限时才发生。清空时保留目录本身而不是删除它，避免在途下载因目录短暂不存在而无法创建临时文件。\n",
        "en": "Keeping the cache from growing without bound, using modification time as both the TTL clock and the access recency. The count cap is checked only after a download and short-circuits on a plain directory listing, so the expensive stat-and-sort path runs only when the cap is exceeded. Clearing keeps the directory itself in place rather than removing it, avoiding a window where in-flight downloads could not create temporary files.\n"
      },
      "source": [
        {
          "path": "src/avatar.js",
          "line": 149,
          "end_line": 211
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",
      "updated_at": "2026-09-16T14:34:23.743Z",
      "fingerprint": "9c82f0c327f3c92532f71d77be46f8fd3d1af9de54ad3726e629b785579a9c08",
      "apis": [
        {
          "protocol": "rpc",
          "path": "sweep()",
          "description": {
            "zh": "删除超过 TTL 未访问的缓存项。\n",
            "en": "Delete cache entries older than the TTL.\n"
          },
          "key": "rpc:sweep()"
        },
        {
          "protocol": "rpc",
          "path": "clear()",
          "description": {
            "zh": "清空缓存目录内容，保留目录本身。\n",
            "en": "Empty the cache directory, keeping the directory itself.\n"
          },
          "key": "rpc:clear()"
        },
        {
          "protocol": "rpc",
          "path": "enforceLimit()",
          "description": {
            "zh": "超过文件数上限时按最旧淘汰。\n",
            "en": "Evict the oldest entries past the file count cap.\n"
          },
          "key": "rpc:enforceLimit()"
        },
        {
          "protocol": "rpc",
          "path": "startTimers({intervalMs})",
          "description": {
            "zh": "启动周期性清理。\n",
            "en": "Start the periodic sweep.\n"
          },
          "key": "rpc:startTimers({intervalMs})"
        }
      ],
      "deps": [
        {
          "kind": "call",

          "label": {
            "zh": "操作缓存文件",
            "en": "Operate on cached files"
          },
          "cross_tree": false
        }
      ],

    "vrcnotifier.infra.avatar.naming": {
      "uid": "82213d5c",
      "id": "vrcnotifier.infra.avatar.naming",
      "parent": "vrcnotifier.infra.avatar",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "缩略图 URL 与 key 规则",
        "en": "Thumbnail URL & Key Rules"
      },
      "description": {
        "zh": "让缓存 key、下载地址与磁盘文件名三者保持一致的命名规则。VRChat 返回的头像有原图与缩略图两种形态、尺寸也随它；本模块把两种形态都改写成统一尺寸的规范缩略图 URL，使同一头像不会以不同名字被缓存两次。缓存文件没有扩展名，因此发送时按魔数还原图片类型。\n",
        "en": "The naming rules that keep cache key, download URL and disk filename in agreement. VRChat returns avatars as either a full file or a thumbnail and at whatever size it likes; both shapes are rewritten into one canonical thumbnail URL at a fixed size, so the same avatar is never cached twice under different names. Cached files carry no extension, so the image type is recovered from magic bytes when serving.\n"
      },
      "source": [
        {
          "path": "src/avatar.js",
          "line": 22,
          "end_line": 87
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",
      "updated_at": "2026-09-16T14:32:30.745Z",
      "fingerprint": "9c82f0c327f3c92532f71d77be46f8fd3d1af9de54ad3726e629b785579a9c08",
      "apis": [
        {
          "protocol": "rpc",
          "path": "toThumbUrl(url, size)",
          "description": {
            "zh": "把任意 VRChat 头像 URL 归一为指定尺寸的缩略图 URL。\n",
            "en": "Normalize any VRChat avatar URL to a thumbnail URL at the requested size.\n"
          },
          "key": "rpc:toThumbUrl(url, size)"
        },
        {
          "protocol": "rpc",
          "path": "thumbKeyFromUrl(url, size)",
          "description": {
            "zh": "由缩略图 URL 推导缓存 key。\n",
            "en": "Derive the cache key from a thumbnail URL.\n"
          },
          "key": "rpc:thumbKeyFromUrl(url, size)"
        },
        {
          "protocol": "rpc",
          "path": "urlFromKey(key)",
          "description": {
            "zh": "由缓存 key 反推上游下载地址，形状不对则返回 null。\n",
            "en": "Rebuild the upstream download URL from a cache key, or null if malformed.\n"

          "key": "rpc:urlFromKey(key)"
        },
        {
          "protocol": "rpc",

          "description": {
            "zh": "按魔数推断图片类型。\n",
            "en": "Detect the image type from magic bytes.\n"
          },
          "key": "rpc:detectImageType(filePath)"
        }
      ],

    "vrcnotifier.infra.avatar.store": {
      "uid": "b1efba8a",
      "id": "vrcnotifier.infra.avatar.store",
      "parent": "vrcnotifier.infra.avatar",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "下载与原子落盘",
        "en": "Download & Atomic Store"
      },
      "description": {
        "zh": "单张图片的下载与落盘。同一 key 的并发请求会合并为一次下载；下载先写临时文件再重命名就位，使读取方永远不会看到写了一半的图片。写入前要求响应为 200、声明图片内容类型、非空且在上限之内。失败的下载不缓存，下一次请求直接重试。\n",
        "en": "Downloading and storing one image. Concurrent requests for the same key collapse into a single download, and a download is written to a temporary file then renamed into place so a reader never sees a half-written image. Before anything is written the response must be 200, must claim an image content type, and must be non-empty and under the size cap. A failed download is not cached, so the next request retries.\n"
      },
      "source": [
        {
          "path": "src/avatar.js",
          "line": 89,
          "end_line": 147
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",

      "apis": [

          "key": "rpc:ensure(key)"
        },

          "path": "cached(key)",
          "description": {

        },

    "vrcnotifier.infra.crypto": {
      "uid": "b94b5920",
      "id": "vrcnotifier.infra.crypto",
      "parent": "vrcnotifier.infra",
      "tree": "vrcnotifier",
      "depth": 3,
      "name": {
        "zh": "数据加密",
        "en": "Data Encryption"
      },
      "description": {
        "zh": "AES-256-GCM，每个值用随机 IV，并把附加认证数据绑定到字段与行身份，因此从某行取出的密文无法被重放到另一行。版本前缀让旧明文直通，并让密钥不符或密文损坏可被检出：它们解密为 null 而不是乱码。密钥解析优先取 Docker Secret 挂载，其次环境变量，都没有时报告未启用加密。\n",
        "en": "AES-256-GCM with a random IV per value and additional authenticated data bound to the field and row identity, so a ciphertext lifted from one row cannot be replayed into another. The version prefix lets legacy plaintext pass through and makes wrong-key or corrupted values detectable: they decrypt to null rather than garbage. Key resolution prefers the Docker secret mount, then an environment variable, otherwise it reports encryption off.\n"
      },
      "source": [
        {
          "path": "src/crypto.js",
          "line": 1,
          "end_line": 79
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",
      "updated_at": "2026-09-16T14:32:30.745Z",

      "apis": [

            "en": "Build an encryptor/decryptor from a 32-byte master key.\n"
          },
          "key": "rpc:createCrypto({masterKey})"
        },
        {
          "protocol": "rpc",
          "path": "resolveMasterKey({secretFile, envKey, devNoEncrypt})",
          "description": {
            "zh": "按优先级解析密钥与模式：Docker Secret、环境变量或不加密。\n",
            "en": "Resolve the key and mode by priority: Docker secret, env var, or none.\n"
          },
          "key": "rpc:resolveMasterKey({secretFile, envKey, devNoEncrypt})"
        },
        {
          "protocol": "rpc",
          "path": "decodeKey(text)",

            "zh": "解码 64 位 hex 或 32 字节 base64 密钥。\n",

          },
          "key": "file:/run/secrets/vrcnotifier_master_key"
        }

      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "分段文件日志",
        "en": "Segmented File Log"
      },
      "description": {
        "zh": "分段文件日志，其序号是文件名与段内行偏移的纯函数。行的身份因此跨重启稳定、对段淘汰免疫，且文件里不需要嵌入任何编号，文本保持干净。启动必定新开一段，段满按字节或行数滚动，段数超过上限时删掉最老的段——因此滚动过程从不改写或重命名文件。\n",
        "en": "Segmented file logging where the sequence number is a pure function of the filename and the line offset inside it. Line identity therefore survives restarts, is immune to segment eviction, and needs nothing embedded in the file, so the text stays clean. Startup always opens a new segment, a segment rolls on size or line count, and the oldest segment is deleted past the cap, so rotation never rewrites or renames a file.\n"
      },

        "zh": "把每行格式化为时间、级别、分类与正文。分类取自行首的方括号标签，使旧调用点继续可用，并用别名表把中英文标签归一到同一套词表。它先写可选的文件日志以便在那里推导序号，并返回日志流条目，使调用方随后能重写该行——这正是启动访问令牌能在原地被打码的方式。\n",
        "en": "Formats every line as time, level, category and body. The category comes from a leading bracketed tag so older call sites keep working, with aliases mapping Chinese and English tags onto one vocabulary. It writes the optional file log first so the sequence number can be derived there, and returns the stream entry so a caller can later rewrite a line — which is how the startup access token gets masked in place.\n"

      "name": {
        "zh": "内存日志流",
        "en": "In-memory Log Stream"
      },
      "description": {
        "zh": "保存最近若干行的环形缓冲与订阅者集合，是面板实时日志视图的数据来源。序号可由外部提供（文件层用文件名与行偏移推导），使内存与磁盘在重启后对同一行达成一致；流内记录历史最大值而非自增计数，因为外部序号是稀疏的。订阅者抛异常不会影响日志，重写某行会带 update 标记通知订阅者。\n",
        "en": "A ring buffer of the most recent lines with a subscriber set, feeding the panel's live log view. Sequence numbers may come from outside (the file layer derives them from filename and offset) so memory and disk agree on line identity across restarts; the stream tracks the highest value seen rather than counting, because those numbers are sparse. A throwing subscriber never breaks logging, and rewriting a line notifies subscribers with an update marker.\n"
      },

      "name": {
        "zh": "Promise 超时兜底",
        "en": "Promise Deadline"
      },
      "description": {
        "zh": "把项目的立场编码成工具：等待是调用方自己的事——原始 promise 不被取消，定时器 unref，超时以兜底结果兑现而不是拒绝。这正是慢速世界名查询能先交还缓存名并在后台继续工作的原因，而不是把需要它的通知一起拖住。\n",
        "en": "Encodes the project's stance that waiting is the caller's problem: the original promise is not cancelled, the timer is unref'd, and the deadline resolves with a fallback result instead of rejecting. That is what lets a slow world-name lookup hand back a cached name and keep working in the background, rather than holding up the notification that needed it.\n"
      },

    "vrcnotifier.infra.util.identity": {

      "depth": 4,
      "name": {
        "zh": "令牌打码与信任等级",
        "en": "Token Masking & Trust Levels"
      },
      "description": {
        "zh": "打码刻意做到既安全又有用：较长的令牌保留前四后四位，使运维能确认当前用的是哪一个；短到这种展示就会泄露的令牌则整体打码。信任等级推导按固定优先级把平台标签集收敛为五个官方等级名，使展示与存储使用同一套词汇。\n",
        "en": "Masking is deliberately lossy enough to be safe and informative enough to be useful: a long token keeps its first and last four characters so an operator can confirm which token is in play, while anything short enough for that to be revealing is masked entirely. Trust level derivation collapses the platform's tag set into the five official level names by fixed priority, so display and storage agree on the vocabulary.\n"
      },
      "source": [
        {
          "path": "src/util.js",
          "line": 22,
          "end_line": 36
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",
      "updated_at": "2026-09-16T14:32:30.745Z",
      "fingerprint": "d45be10322348d08689f4370017a56b85227e1051cb460ef6fd221c61535d6eb",
      "apis": [
        {
          "protocol": "rpc",
          "path": "maskKey(token)",
          "description": {
            "zh": "令牌打码，仅保留前四后四位。\n",
            "en": "Mask a token keeping only its first and last four characters.\n"
          },
          "key": "rpc:maskKey(token)"
        },
        {
          "protocol": "rpc",
          "path": "trustLevelFromTags(tags)",
          "description": {
            "zh": "把 VRChat 信任标签映射为官方等级名。\n",

        "zh": "断线与 401 的统一故障语义（首次连接不算故障）：故障开始时打时间戳并挂定时器，只有持续超过阈值才推送一次故障通知，之后若恢复则补发一条恢复说明。订阅 ws-open/ws-close/relogin-needed/unauthorized-2fa/snapshot/session-expired 来驱动启动说明、恢复文案与会话失效通知。\n",
        "en": "Unified fault semantics for disconnects and 401s (the first connection never counts as a fault): a fault stamps the start time and arms a timer; only if it lasts past the threshold is one failure notice sent, and a recovery afterwards sends a matching recovery notice. It subscribes to ws-open/ws-close/relogin-needed/unauthorized-2fa/snapshot/session-expired to drive startup notices, recovery texts and the session-invalidated notice.\n"

      "name": {
        "zh": "群组名缓存与退避",
        "en": "Group Name Cache & Backoff"
      },
      "description": {
        "zh": "为公告通知解析群名。先查缓存（成功名有效期 1 小时；缓存为未知群组时按 retry_at 决定是否复用），未命中优先批量拉取用户群组灌缓存（区分成员关系 id 与群组 id），仍不行再单查群组；失败时写回按 5 秒起、逐次翻倍、封顶 1 小时的退避窗口，使通知永不被名称解析阻塞。\n",
        "en": "Resolves group names for announcement notifications. It checks the cache first (successful names live one hour; a cached unknown-name entry is reused until its retry time), then prefers one bulk user-groups call to warm the cache (distinguishing membership ids from group ids), falls back to a single group lookup, and on failure stores a backoff window that grows 5s doubling up to one hour so notifications are never blocked by name resolution.\n"
      },

      "name": {
        "zh": "好友变更分发与去重",
        "en": "Friend Change Dispatch & Dedupe"
      },
      "description": {
        "zh": "好友变更通知的唯一收口。没有总开关：每条变更自带要检查的 notifyField，新好友默认全关。去重 key 包含新旧状态与世界，避免同一好友的不同变化被吞掉；未命中则落标记，补齐名称/头像/事件类型与本地时间戳后发送并发出 notification 事件。\n",
        "en": "The single funnel for friend-change notifications. There is no global switch: each change carries the notifyField to check on the friend row, and newly added friends default to all-off. The dedupe key includes old and new status as well as the world so distinct transitions for the same friend are not swallowed; on a miss it marks the key, then fills in name, avatar, event type and local timestamp before sending and emitting the notification event.\n"
      },

    "vrcnotifier.monitor.notify.coalesce": {

      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "变更类型映射与合并",
        "en": "Change Type Mapping & Coalescing"
      },
      "description": {
        "zh": "把“发生了什么变化”与“怎么报出去”分开。来自 friend-update 的状态变化先压合并窗口；若窗口内同好友的 friend-location 到达且新状态相同，则补回被压的旧状态并把两条并作一条发出，否则窗口到期后单独推送。eventTypeFor 为每种变更类型给出稳定的机器可读事件名。\n",
        "en": "Separates 'what changed' from 'how it is reported'. A status change arriving from friend-update is held for the coalescing window; if a friend-location for the same friend arrives inside that window with the same new status, the held old status is restored and the two are emitted as one message, otherwise the timer fires and the status change goes out alone. eventTypeFor gives each change type a stable machine-readable event name.\n"
      },

        "zh": "站内通知解析与推送",
        "en": "VRChat Notification Parsing & Dispatch"
      },
      "description": {
        "zh": "处理 VRChat 站内通知并复用同一通知渠道，但只放行三类：世界邀请、戳一戳与群组公告。类型开关读全局设置，且必须在去重标记之前判定，否则“关掉再打开”会补推积压；自己发出的通知丢弃；邀请类从其负载提取世界（details 在 REST 下是 JSON 字符串、WS 下是对象），公告类提取群组并用群名作为发送者展示。\n",
        "en": "Handles VRChat in-app notifications and reuses the same notification channels, but only for three kinds: world invites, boops and group announcements. Type switches come from global settings and are consulted before the dedupe mark so turning a switch off then on cannot replay a backlog; self-sent notifications are dropped; invite payloads have their world extracted (details may be a JSON string over REST or an object over WS) and announcements their group, whose name replaces the sender.\n"
      },

      "depth": 4,
      "name": {
        "zh": "帧准入与分派",
        "en": "Frame Admission & Dispatch"
      },
      "description": {
        "zh": "每一帧在被处理前要过四道检查：会话存在、用户不在等待对账、用户仍在库中、帧带 content。通知生命周期事件（see/hide/response/clear/v2 更新与删除）显式记录并忽略，避免默默落到默认分支；未知类型直接丢弃；整个 switch 外层包 try/catch，单条脏事件不会中断消息流。\n",
        "en": "Every frame passes four checks before it is acted on: a session must exist, the user must not be waiting for a reconciliation, the user must still be in the database, and the frame must carry content. Notification lifecycle events (see, hide, response, clear, v2 update/delete) are explicitly acknowledged and ignored so they cannot silently fall through, unknown types are dropped, and the whole switch is wrapped so one malformed event can never break the stream.\n"
      },

        "en": "Reconnect Resynchronisation"
      },
      "description": {
        "zh": "重连意味着本地画面可能已经过时，因此把该用户放入等待对账集合并立即触发全量对账；在对账完成之前丢弃所有 WebSocket 消息并记一条日志。用少量消息丢失换取一个保证：不会基于前端未曾见过的状态缺口推导状态。\n",
        "en": "A reconnect means the local picture may be stale, so the user is put into the awaiting-snapshot set and a full reconciliation is triggered; until it finishes every WebSocket message is dropped with a log line. This trades a little message loss for the guarantee that no state is derived from a gap the panel never saw.\n"
      },

    "vrcnotifier.monitor.snapshot.auth-401": {
      "uid": "4bcd2522",
      "id": "vrcnotifier.monitor.snapshot.auth-401",
      "parent": "vrcnotifier.monitor.snapshot",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "对账 401 分流",
        "en": "Reconciliation 401 Branching"
      },
      "description": {
        "zh": "VRChat 的 401 并不只有一种：Missing Credentials 表示 cookie 作废（典型是换 IP），需要带密码完整重登；Unauthorized 表示会话被挂起，只需重过一遍 2FA；其余则是会话彻底失效，需要通知用户并停用。正是这个分流让可恢复的抖动不会被当成登出。\n",
        "en": "VRChat's 401s are not one thing: 'Missing Credentials' means the cookie is void (typically an IP change) and asks for a full re-login with the password, 'Unauthorized' means the session is suspended and only needs the 2FA step again, and anything else is a dead session that is reported to the user and deactivated. The distinction is what keeps a recoverable hiccup from looking like a logout.\n"
      },
      "source": [
        {
          "path": "src/monitor.js",
          "line": 834,
          "end_line": 853
        }
      ],

      "apis": [
        {
          "protocol": "rpc",
          "path": "handleAuth401(e, userId)",

      "name": {
        "zh": "对账进度上报",
        "en": "Reconciliation Progress Reporting"
      },
      "description": {
        "zh": "按语义阶段上报登录进度，而不绑定具体 HTTP 请求——密码直登与 2FA 两条路的请求序列不同，绑请求会让等待页错位。好友拉取百分比始终以名册总数为分母累加在线与离线两趟，并在名册拉完后收口到 100%。\n",
        "en": "Reports login progress at semantic stages rather than tied to concrete HTTP requests, because the password and 2FA paths issue a different request sequence and binding to requests would misalign the overlay. The friend-fetch percentage always divides by the roster total, accumulating both the online and offline passes, and is forced to 100% once the roster is exhausted.\n"

      "id": "vrcnotifier.monitor.snapshot.run",

      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "全量对账主流程",
        "en": "Snapshot Reconciliation Run"
      },
      "description": {
        "zh": "一次 me() 同时获得三个在线状态数组、好友名册与自身在线状态。随后在线与活动好友用一次分页请求取详情，离线好友零请求（首次对账额外拉一次离线名册以补全资料），逐个喂给状态机；已入库但不在名册中的行视为已删除好友并删除。状态数组缺失时本轮跳过好友判定而不是猜测；任何未预期异常都被捕获，不会穿透调用方。\n",
        "en": "One me() call yields the three presence arrays, the friend roster and the user's own presence. Online and active friends are fetched in one paged request while offline friends cost nothing; each friend is fed through the state machine, and rows absent from the roster are treated as removed friends and deleted. A missing status array skips friend judgement for that round rather than guessing, and unexpected exceptions are caught so the caller never sees them.\n"
      },

      "name": {
        "zh": "好友输入落地",
        "en": "Friend Input Persistence"
      },
      "description": {
        "zh": "好友数据入库的唯一入口。首见好友直接按现状插入，不比较也不通知；否则先更新资料字段，再由状态机差分在线字段。把结果 dbUpdate 连同实例号（undefined 时保留旧值）与 last_seen 一起写库，据此排期或清理 pending 定时器；只有状态机判定要通知且调用方未要求静默时才发通知——首次对账传 silent，只建基线。\n",
        "en": "The one place friend data reaches the database. A first-seen friend is inserted as-is with no comparison and no notification; otherwise profile fields are updated and the state machine diffs presence. The resulting update, instance id and last_seen are stored, the pending timer is armed or cleared, and notifications go out only when the state machine agrees and the caller did not ask for silence.\n"
      },

      "name": {
        "zh": "下线待定批量确认",
        "en": "Offline Pending Verification"
      },
      "description": {
        "zh": "针对疑似下线的防闪烁确认。同一账号的全部 pending 好友共享一个定时器与一次 me() 调用；到期点取“最后到达加确认延迟”与“最早 pending 加两倍延迟”的较小值，既能把突发合并成一次请求，又保证持续下线流不会把验证饿死。到期后重读三个在线状态数组判定是否真离线；名册中查无此人则视为已删好友并删行。\n",
        "en": "Anti-flicker confirmation for suspected disconnects: all pending friends of one account share one timer and one me() call, so a burst collapses into a single request while a continuous offline stream never starves verification. On expiry the three presence arrays decide whether the friend is really offline, and an absent roster entry means a removed friend whose row is deleted.\n"
      },
      "source": [
        {
          "path": "src/monitor.js",
          "line": 484,
          "end_line": 573
        }
      ],

          },
          "key": "rpc:schedulePendingCheck(user, friendVrcId)"

      "depth": 4,
      "name": {
        "zh": "自身在线状态落地",
        "en": "Self Presence Persistence"
      },
      "description": {
        "zh": "自己的在线状态只入库并推给面板，绝不进入通知链、去重或 pending 逻辑。状态派生刻意把 offline/空位置归为网页在线，因为此时网页会话仍在活动；private、traveling 或 wrld_ 位置表示游戏在线。显式传入的字段优先，缺失字段继承库中旧值。\n",
        "en": "The user's own presence is persisted and pushed to the panel but never enters the notification chain, dedupe or pending logic. The state derivation deliberately maps an offline or empty location to web-online, because the web session is still active in that case; a private, traveling or wrld_ location means in-game online. Explicit incoming fields win, missing ones inherit the stored value.\n"
      },

    "vrcnotifier.monitor.timers": {

      "id": "vrcnotifier.monitor.timers",

      "tree": "vrcnotifier",
      "depth": 3,
      "name": {
        "zh": "定时器生命周期",
        "en": "Timer Lifecycle"
      },
      "description": {
        "zh": "自动对账是滑动窗口：任何一次对账触发都会清掉旧定时器并把下一次推到完整间隔之后，因此频繁活动只会顺延而不会叠加。启动是幂等的，同时装上 watchdog 间隔；所有定时器都 unref，且回调全部挂 catch，调度与 promise 拒绝都不会拖垮进程。\n",
        "en": "The automatic reconciliation is a sliding window: any reconciliation trigger clears the old timer and pushes the next run a full interval into the future, so frequent activity keeps deferring it rather than piling on. Start is idempotent and also installs the watchdog interval; every timer is unref'd and every callback catches, so neither the scheduler nor a rejected promise can take the process down.\n"
      },
      "source": [
        {
          "path": "src/monitor.js",
          "line": 1072,
          "end_line": 1098
        }
      ],

      "apis": [

      "description": {
        "zh": "VRChat 管线除协议层 ping 外没有应用层心跳，因此用“沉默”判断存活：已连接但最后一条消息早于 watchdog 窗口的用户会被强制重连，而重连路径会先对账再处理新消息。看门狗只触发重连，绝不自行翻转在线状态。\n",
        "en": "VRChat's pipeline protocol has no application-level heartbeat beyond the protocol ping, so liveness is judged by silence: any connected user whose last message is older than the watchdog window is force-reconnected, and the reconnect path then reconciles before processing new messages. The watchdog only triggers reconnection, it never flips presence state itself.\n"
      },

        "en": "The single send funnel. Every proactive message goes through a promise chain keyed by binding so two notifications can never race, with a minimum spacing between sends. Network errors, 429 and 5xx are retried, 401 and 403 force a token refresh then retry once, and other 4xx fail immediately. A markdown passive reply that is rejected falls back to plain text. Text is truncated to the platform limit.\n"
      },

      "description": {
        "zh": "网关状态机。Hello 携带心跳间隔并触发 identify；op 0 分发 READY 与两个 C2C 消息事件；op 11 确认心跳，若连续三个间隔无确认则看门狗终止连接；op 7 要求重连，op 9 要求重建会话。两个关闭码表示机器人被永久停用，此时停止重连；其余情况按指数退避加抖动重连。\n",
        "en": "The gateway state machine. Hello carries the heartbeat interval and triggers identify; op 0 dispatches READY and the two C2C message events; op 11 acknowledges heartbeats and a watchdog terminates the socket after three idle intervals; op 7 asks for a reconnect and op 9 for a fresh session. Two close codes mean the bot is permanently disabled and reconnection stops, while everything else backs off exponentially with jitter.\n"
      },

      },
      "description": {
        "zh": "获取并缓存机器人访问令牌，在过期前留出安全余量刷新，并把并发刷新合并到同一个 promise 上。被服务端明确判定为无效的凭据按终止处理：清空 QQ 设置并停止机器人，让面板显示配置问题而不是无止境的循环重试。\n",

    "vrcnotifier.qq.commands.handler": {

      "id": "vrcnotifier.qq.commands.handler",

      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "指令处理与世界名补全",
        "en": "Command Handler & World Fill"
      },
      "description": {
        "zh": "指令处理把 2FA 验证码入口放在最前：等待验证期间先消费验证码回复并直接返回，根本不会去构造在线列表——这正是重登过程中直接发六位数字就能生效的原因。在线好友的世界名在同一个共享时限内统一解析，而不是每人等一次；超时则回退缓存名，后台查询继续。连接不健康时会在开头加一行数据截止时间，避免把过期列表当成实时。\n",
        "en": "The command handler gives the 2FA intake first refusal: while a verification is pending, a code reply is consumed and returned before the online list is built, which is why a bare six-digit message works during re-login. World names are resolved under one shared deadline, falling back to cached names while background lookups continue, and an unhealthy connection prepends a data-cutoff header so a stale list is not mistaken for live.\n"
      },

        "zh": "POST /api/login：校验入参、清理过期的 pending 2FA 记录，用新的无 jar 客户端登录；VRChat 要求 2FA 时存入临时会话（密码在 TTL 内驻留内存）并返回可用的验证方式，否则直接落地会话。在耗时的好友同步之前先发 sync-progress verified，让等待页按顺序逐行点亮。\n",
        "en": "POST /api/login: validates the body, prunes expired pending-2FA entries, logs in with a fresh jar-less client; when VRChat demands 2FA it stores a temp session (password held in memory for the TTL) and returns the accepted factors, otherwise it finalizes the session. Emits sync-progress verified before the slow friend sync so the boot overlay lights up in order.\n"
      },

      "name": {
        "zh": "重登循环与退避",
        "en": "Re-login Loop & Backoff"
      },
      "description": {
        "zh": "按 VRCX 同款方式重登：先复用旧 cookie jar 带上上下文，再用保存的密码登录。遇到 2FA 挑战则挂起并同时经 QQ 与 SSE 2fa-needed 通知；成功后落地会话并广播 relogin-ok；401 立即失败，网络/429/5xx 走退避。滚动 1 小时上限防止持续冲击登录接口。\n",
        "en": "Executes re-login the VRCX way: reuse the old cookie jar so the request carries context, then log in with the saved password. A 2FA challenge parks the attempt and notifies over QQ plus an SSE 2fa-needed event; success finalizes the session and broadcasts relogin-ok; a 401 fails fast while network, 429 and 5xx errors back off. A rolling hourly cap prevents hammering the login endpoint.\n"
      },

        "en": "Avatar serving chain mounted at /api/avatar: with no cache configured it 404s outright; otherwise a login guard (401), an on-demand ensure(key) step (400 on bad encoding, 502 on download failure), an express.static over the cache directory (365-day immutable, dotfiles ignored so atomic temp files never leak, Content-Type from magic bytes, mtime touched to extend TTL) and a final 404. Path traversal defence is delegated to the static root.\n"
      },

        "zh": "GET /api/logs 有三种形态：before=seq&limit 从分段日志文件向前翻历史，并继续扫描直到凑满一页匹配行；after=seq 补 SSE 断线缺口，优先读文件而非内存环形缓冲；tail=N 返回最新若干行，游标取文件水位，使重启后内存流为空时也能正确作答。所有出站行均打码。\n",
        "en": "GET /api/logs has three shapes: before=seq&limit reads older history from the segmented log file and keeps scanning until a full page of matching lines is collected; after=seq fills the gap left by an SSE reconnect, preferring the file over the in-memory ring; and tail=N returns the newest lines using the file watermark as cursor so a restarted process with an empty memory stream still answers correctly. Every outbound line is token-masked.\n"
      },

        "en": "The only streaming endpoint. Writes the text/event-stream headers (with X-Accel-Buffering disabled for proxies), sends a leading : connected comment, registers the response in the client set, keeps it alive with a 25-second : ping comment, and cleans up the interval and set entry when the request closes. No id/retry fields are emitted — gap filling is client-driven through /api/logs?after=seq.\n"
      },

      "depth": 4,
      "name": {
        "zh": "请求传输与限流退避",
        "en": "Request Transport & Throttling"
      },
      "description": {
        "zh": "所有 VRChat 调用底下的传输层。请求带上目标 URL 的 cookie 头，并按一分钟滑动窗口限流；429、网络错误与 5xx 按指数退避加抖动重试，次数有界；401 永不重试，因为那是需要调用方解决的会话问题。登录、2FA 与 authToken 主动关闭重试，让用户立即看到失败。\n",
        "en": "The transport beneath every VRChat call. Requests carry the cookie header for the target URL and are throttled by a sliding one-minute window; 429, network errors and 5xx retry with exponential backoff plus jitter up to a bounded attempt count, while 401 is never retried because it is a session problem for the caller to resolve. Login, 2FA and authToken opt out of retries so the user sees failures immediately.\n"
      },

        "zh": "通过无凭据探测公开 config 端点持续测量 VRChat API 延迟（health 端点会 401 因此不可用）。每轮取若干计时样本，舍去超时者并对其余取平均；整轮失败时沿用上次成功值并标记 stale，而不是来回跳成错误。每轮完成后推送给订阅者，面板无需轮询。\n",
        "en": "Continuously measures VRChat API latency by probing the public config endpoint without credentials (the health endpoint would 401). Each round takes several timed samples, discards timeouts and averages the rest; when a whole round fails it keeps showing the last successful value marked stale rather than flapping to an error. Every completed round is pushed to subscribers so the panel never polls.\n"

    "vrcnotifier.vrc.pipeline.connection": {
      "uid": "755883fd",
      "id": "vrcnotifier.vrc.pipeline.connection",
      "parent": "vrcnotifier.vrc.pipeline",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "连接与重连保活",
        "en": "Connection & Reconnect Lifecycle"
      },
      "description": {
        "zh": "每用户一条连接的生命周期。VRChat 协议没有应用层心跳，因此存活判断依赖协议 ping 与 pong 超时（超时即终止僵尸连接），以及有界指数退避的重连。持续失败超过阈值的连接只触发一次故障回调；之后成功打开时会标明这是一次恢复，使监控层能区分两者。\n",
        "en": "Connection lifecycle, one connection per user. The VRChat protocol has no application-level heartbeat, so liveness relies on the protocol ping with a pong timeout that terminates zombie sockets, plus reconnection with bounded exponential backoff. A connection failing past the threshold fires the failure callback once, and a later successful open reports itself as a recovery so the monitor can tell the two apart.\n"
      },
      "source": [

        },

          "description": {

          },

        },

          "path": "scheduleReconnect(userId, conn)",
          "description": {
            "zh": "按指数退避加抖动排期下一次重连。\n",
            "en": "Schedule the next reconnect with exponential backoff and jitter.\n"

      },
      "description": {
        "zh": "管理器的对外方法面。forceReconnect 刻意只负责关闭套接字，把通知与重连安排全部交给 close 处理函数，使强制重连与自然断线走同一条路径——否则监控层的连接标志会停在陈旧值，真正的故障反而不会报警。\n",
        "en": "The manager's public surface. forceReconnect deliberately only closes the socket and leaves notification plus rescheduling to the close handler, so a forced reconnect travels the same path as a spontaneous disconnect — otherwise the monitor's connection flag would stay stale and a real outage would go unreported.\n"
      },

    "vrcnotifier.vrc.pipeline.frames": {
      "uid": "4ed8532b",
      "id": "vrcnotifier.vrc.pipeline.frames",

      "depth": 4,
      "name": {
        "zh": "帧解析与串行队列",
        "en": "Frame Parsing & Serial Queue"
      },
      "description": {
        "zh": "两个看似不起眼但很关键的行为。其一，帧会与同一连接上的上一帧去重（基线在 open 时清空，避免新连接的首帧被吞），且 content 为字符串时会再解析一次，因为 VRChat 的某些通知就是这样发的。其二，同一用户的所有处理按 promise 链串行，慢异步工作也不会把该用户的事件乱序。\n",
        "en": "Two deceptively important behaviours. First, frames are de-duplicated against the previous frame of the same connection (the baseline is cleared on open so the first frame of a new connection is never swallowed), and a string content field is parsed a second time because VRChat sends some notifications that way. Second, all handlers for one user run on a promise chain, so slow async work can never reorder events for that user.\n"
      },

      "name": {
        "zh": "VRChat 服务状态",
        "en": "VRChat Service Status"
      },
      "description": {
        "zh": "仿 VRCX 上报 VRChat 自身的服务健康。它是惰性的——只有面板询问时才发请求——结果缓存一分钟，并发调用共享同一次在途请求。全部正常映射为 normal，次要问题为 degraded，重大或严重为 outage；异常时额外拉取组件汇总，让面板能展示受影响的具体部分。刷新失败则沿用上次成功值并标记 stale。\n",
        "en": "Reports VRChat's own service health the way VRCX does. It is lazy — the request only happens when the panel asks — and the result is cached for a minute, with concurrent calls sharing one in-flight request. All-systems-operational maps to normal, minor to degraded and major or critical to outage; when something is wrong it additionally pulls the component summary so the panel can show which parts are affected. A failed refresh keeps the last good value marked stale.\n"
      },

    "vrcnotifier.vrc.world.cache": {
      "uid": "97c5e8cf",
      "id": "vrcnotifier.vrc.world.cache",
      "parent": "vrcnotifier.vrc.world",

      "depth": 4,
      "name": {
        "zh": "缓存、冷却与请求合并",
        "en": "Cache, Cooldown & Coalescing"
      },
      "description": {
        "zh": "缓存之上的策略：成功名有效期 1 小时；同一世界的并发调用共享同一次在途请求；刚完成的结果在合并窗口内复用。连续失败转入冷却，从 5 分钟逐次翻倍到 1 小时封顶，冷却期内调用方立刻拿到缓存的（可能过期的）名字而不再等待——因为晚报到的结果已无人消费。跟踪表有上限并会清理。\n",
        "en": "Policy around the cache: a successful name lives one hour, an in-flight request is shared by all callers asking for the same world, and a result settled within the dedupe window is reused. Repeated failures switch to a cooldown that doubles from five minutes to one hour, during which callers get the cached (possibly stale) name immediately instead of waiting — because a late answer has no consumer. Tracking maps are bounded and swept.\n"
      },

      "name": {
        "zh": "查询与失败兜底",
        "en": "Lookup & Failure Fallback"
      },
      "description": {
        "zh": "真正的查询与失败分类。404/403 是永久性的，立刻进入冷却；429 是在说“别打了”，同样直接冷却而不重试；网络、超时与 5xx 才就地重试一次，仍失败再冷却。响应缺少 name 字段视为异常，而空名字是合法的，回退用世界编号。\n",
        "en": "The actual lookup with its failure taxonomy. A 404 or 403 is permanent so it cools down immediately; a 429 is a request to stop so it also cools down rather than retrying; network, timeout and 5xx errors retry once in place and only then cool down. A response missing the name field counts as abnormal, while an empty name is legal and falls back to the world id.\n"
      },

        "en": "Concurrency & Rate Scheduler"
      },
      "description": {
        "zh": "挡在每次世界请求前的小调度器：同时在途不超过 N 个，每分钟不超过 M 次。仅因速率被挡住时，它会睡到最旧的时间戳滑出窗口再继续，而不是忙等，因此一批好友同时换世界也不会冲垮公开 API。\n",
        "en": "A small scheduler in front of every world request: at most N requests in flight and at most M per minute. When only the rate limit blocks progress it sleeps until the oldest timestamp leaves the window rather than busy-waiting, so a burst of friends changing worlds cannot flood the public API.\n"
      },

        "zh": "所有功能共用的唯一请求入口。它带上 Bearer 令牌，并按报文把 401 分成两种：未登录类会让用户回到登录页但不打断事件流；其余 401 会停止事件流并弹出连接门禁，因为令牌本身不对。视图切换同时决定何时停止日志轮询，确保没有定时器活得比它的屏幕更久。\n",
        "en": "The single request helper every feature goes through. It attaches the Bearer token, and treats 401 as two different things depending on the message: a not-logged-in response drops the user to the login view without disturbing the event stream, while any other 401 stops the stream and shows the connection gate because the token itself is wrong. Switching views also decides when the log view should stop polling, so no timer outlives its screen.\n"
      },

        "en": "The last step before the panel appears, which exists purely so the transition never looks broken. It waits for the images that will actually be visible in the first screen, counting only rows in the viewport that are not inside a collapsed group, with a fixed budget so one slow avatar cannot hold the whole boot; the overlay then fades while the main view replays its entrance underneath.\n"

    "vrcnotifier.web.app.boot.halo": {
      "uid": "f6a0044c",
      "id": "vrcnotifier.web.app.boot.halo",
      "parent": "vrcnotifier.web.app.boot",
      "tree": "vrcnotifier",
      "depth": 5,
      "name": {
        "zh": "启动光环动画",
        "en": "Boot Halo Animation"
      },
      "description": {
        "zh": "每个进行中的行带一圈呼吸光环，而收尾比移除一个 CSS 类要讲究：先读回正在播放的动画当前 transform，再在短时长内收到 scale(1)并用 forwards 保持，使光环从它真实所在的位置平滑停下而不是硬跳。句柄按行保存，使重置总能清掉残留。\n",
        "en": "Each pending row carries a breathing halo, and finishing it is subtler than removing a CSS class: the running animation is read back as its current transform and then settled to scale one over a short duration with forwards fill, so the halo eases to a stop from wherever it actually was instead of snapping. Handles are kept per row so a reset can always clear leftovers.\n"
      },
      "source": [

          "line": 805,
          "end_line": 859
        }
      ],

      "apis": [

            "en": "Run the breathing halo or settle it to a stop.\n"
          },
          "key": "rpc:bootHalo(i, mode)"
        },

      "name": {
        "zh": "百分比里程表",
        "en": "Percentage Odometer"
      },
      "description": {
        "zh": "百分比由三条数字带构成的里程表实现，靠 transform 动画推进，并做节流以免数字带糊成一团，但始终强制精确落到目标值。两条规则让它保持诚实：数值只增不减；尚未收到真实进度时完全不显示数字，而不是编一个看着合理的数。\n",
        "en": "The percentage is an odometer built from three digit strips animated by transform, throttled so the strips stay legible instead of blurring, but always forced to land exactly on the target. Two rules keep it honest: the value never decreases, and when no real progress has arrived yet it displays no digit at all rather than inventing a plausible number.\n"
      },

      "name": {
        "zh": "启动状态机",
        "en": "Boot State Machine"
      },
      "description": {
        "zh": "浮层由服务端的语义阶段驱动，而不是客户端自己的请求序列，因为密码直登与 2FA 的请求序列不同，绑请求会让显示错位。它刻意不着急：一行只有在完成标记已置、已停留满最短时间、且（对好友拉取行）百分比已追平后才转绿。任何错误都会立即收起浮层。\n",
        "en": "The overlay is driven by semantic stages from the server rather than the client's own request sequence, because the password and 2FA paths issue different requests and binding to them would misalign the display. It is deliberately unhurried: a row turns green only when its mark is set, it has been visible for a minimum dwell time, and for the friend-fetch row the percentage has caught up. Any error dismisses the overlay immediately.\n"
      },

      "name": {
        "zh": "启动引导与地址发现",
        "en": "Bootstrap & Address Discovery"
      },
      "description": {
        "zh": "启动与地址发现。加载时先从 sessionStorage 同步恢复上次视图与页签，使首帧就是正确的屏幕；随后探测后端：一体化部署时同源优先，其次是已存地址，最后是本地默认值。此步失败并不致命——会显示连接门禁让用户手填地址。\n",
        "en": "Startup and address discovery. On load it synchronously restores the last view and tab from session storage so the first frame is already the right screen, then probes for a backend: same origin wins for the single-process deployment, otherwise the stored address, otherwise the local default. A failure here is not fatal — the connection gate is shown so the user can type an address instead.\n"
      },

    "vrcnotifier.web.app.connection-gate": {
      "uid": "9d82c2c6",
      "id": "vrcnotifier.web.app.connection-gate",
      "parent": "vrcnotifier.web.app",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "连接门禁与心跳",
        "en": "Connection Gate & Heartbeat"
      },
      "description": {
        "zh": "应用之前的门，以及门后的看门狗。门禁收集协议、主机、端口与令牌，向后端校验通过后才展示登录页。进入之后由 4 秒心跳持续看守：后端不应答时弹出重连弹窗，但带冷却，使短暂重启不会引发弹窗风暴；后端恢复后弹窗自动关闭。\n",
        "en": "The wall in front of the app, and the watchdog behind it. The gate collects scheme, host, port and token, verifies them against the backend and only then reveals the login view. Once inside, a four-second heartbeat keeps watching: when the backend stops answering the reconnect modal appears, but with a cooldown so a brief restart does not produce a modal storm, and it closes itself automatically when the backend comes back.\n"
      },

      "depth": 4,
      "name": {
        "zh": "特别关注 FLIP 动画",
        "en": "Favorite Toggle FLIP Animation"
      },
      "description": {
        "zh": "切换特别关注时的 FLIP 动画。它不是重渲染后让行瞬移到另一个分组，而是先捕获旧矩形、更新 DOM，再把每个移动过的行从旧位置动画到新位置——分组标题与组体也在内，因此整块一起滑动。这正是“标为特别关注”让人感觉行真的移了过去，而不是页面跳了一下。\n",
        "en": "A FLIP animation for toggling favorite. Rather than re-rendering and letting the row teleport between groups, the old rectangles are captured, the DOM is updated, and every row that moved is animated from its previous position to its new one — including the group header and the group body, so the whole block slides together. This is what makes marking a favorite feel like the row physically moves rather than the page jumping.\n"
      },

        }

      },

        "en": "Committing a per-friend toggle. The switch flips immediately and the request is sent in the background, because waiting for a round trip before showing a checkbox move feels broken; if the server rejects, the switch and the cached friend object are rolled back to their previous values and the error is surfaced. A single delegated listener handles the whole list rather than one handler per row.\n"

        "zh": "登录面及其后续。表单把密码错误、限流与需要邮箱验证三种情况用不同文案区分，2FA 挑战则原地换成验证码表单。登出是带两个独立勾选项的弹窗——清缓存与清设置，因为两者含义差别很大；账号数据始终在服务端清除。重登弹窗复用同一条验证码路径，使挂起的会话无需完整登录即可恢复。\n",
        "en": "The login surface and its aftermath. The form distinguishes password failure, rate limiting and the email-verification case with distinct messages, and a 2FA challenge swaps the form in place. Logout is a modal with two independent opt-ins, clearing caches and clearing settings, because they mean very different things; account data is always cleared server-side. A re-login modal reuses the same code path to revive a suspended session.\n"

    "vrcnotifier.web.app.presence-motion": {

      "id": "vrcnotifier.web.app.presence-motion",
      "parent": "vrcnotifier.web.app",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "上下线差分动画",
        "en": "Presence Diff Animation"
      },
      "description": {
        "zh": "针对实时在线状态更新的纯客户端差分。刷新时把新数据与当前 DOM 对比：更换分组的行飞过去，没换组的行只把状态文案翻动；整个过程压在一个很短的合并窗口内，使一串事件只产生一次动画而不是频闪。绝不整表重渲染，滚动位置与折叠状态因此保持稳定。\n",
        "en": "Purely client-side diffing for realtime presence updates. A refresh compares the incoming data against what is currently in the DOM, flies the rows that changed group and rolls the status text of rows that did not, all inside a short coalescing window so a burst of events produces one animation instead of a strobe. Nothing is re-rendered wholesale, keeping scroll position and collapsed groups stable.\n"
      },
      "source": [
        {
          "path": "public/app.js",
          "line": 1258,
          "end_line": 1331
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",
      "updated_at": "2026-09-16T14:34:23.743Z",
      "fingerprint": "06609d43725c1483a940506f664ec39835212c390e7767362f17ac852efcc15d",
      "apis": [
        {
          "protocol": "rpc",
          "path": "captureRowsState()",
          "description": {
            "zh": "刷新前捕获名册的视觉状态。\n",
            "en": "Capture the roster's visual state before a refresh.\n"
          },
          "key": "rpc:captureRowsState()"
        },
        {
          "protocol": "rpc",
          "path": "rollStateText(row, newHtml, newTxt, oldHtml, oldTxt)",
          "description": {
            "zh": "把状态单元格从旧文本滚到新文本。\n",
            "en": "Roll a status cell from old text to new text.\n"
          },
          "key": "rpc:rollStateText(row, newHtml, newTxt, oldHtml, oldTxt)"
        },
        {
          "protocol": "rpc",
          "path": "refreshFriendsWithMotion()",
          "description": {
            "zh": "把新数据与 DOM 对比，仅为变化项做动画。\n",
            "en": "Diff the fresh data against the DOM and animate only what changed.\n"
          },
          "key": "rpc:refreshFriendsWithMotion()"
        }
      ],
      "deps": [
        {
          "kind": "call",

          "label": {
            "zh": "读取已渲染行",
            "en": "Read the rendered rows"
          },
          "cross_tree": false
        }
      ],

        "en": "Friend data loading and the per-person rendering pieces. World names arrive later than the roster because they are resolved on demand, so this module also owns the targeted update that patches a name into the rows showing that world when the world-name event arrives — the list is never blocked waiting for names, and never redrawn wholesale to show one.\n"

      },
      "description": {
        "zh": "设置页。由于服务端从不返回 QQ AppSecret，密码框填充的是掩码哨兵；原样提交会被服务端解释为保持原值，因此保存无关设置永远不会删掉凭据。机器人总开关关闭时会隐藏自己的字段，且切换立即保存而不等保存按钮。\n",
        "en": "The settings page. Because the server never returns the QQ app secret, the password field is populated with a mask sentinel; submitting it unchanged is interpreted server-side as keep the stored value, so saving unrelated settings never wipes credentials. The bot switch hides its own fields when off, and toggling it saves immediately rather than waiting for the save button.\n"
      },

      "name": {
        "zh": "概览卡片与回到顶部",
        "en": "Overview Cards & Back to Top"
      },
      "description": {
        "zh": "概览条的行为：点击卡片会让该项闪一下，使点击即使没改变底层数值也有可见后果；回到顶部按钮在滚动超过阈值时出现和消失，而不是一动就冒出来。这些细节之所以重要，多半是因为一旦缺失，界面就会被感受为“没反应”。\n",
        "en": "The overview strip's behaviour: clicking a card flashes that item so the click has a visible consequence even when the underlying value is unchanged, and the back-to-top button appears and disappears around a scroll threshold rather than at the very first pixel. These are small things that mostly matter because their absence is felt as the interface being unresponsive.\n"
      },

      "name": {
        "zh": "页签导航",
        "en": "Tab Navigation"
      },
      "description": {
        "zh": "页签切换保留了一个有意的不对称：用户点击时播放快速交叉淡入与卡片级联入场，而加载时恢复上次页签则静态渲染，避免每次刷新都对着用户放一遍动画。指示块只在容器可见时测量，因为测量隐藏元素会得到错误的位置。\n",
        "en": "Tab switching with an intentional asymmetry: a user click plays a quick cross-fade plus a staggered card entrance, while restoring the previous tab on load renders statically so the panel does not appear to animate at the user on every refresh. The indicator is only measured while the container is visible, because measuring a hidden element yields the wrong position.\n"
      },
      "source": [

            "en": "Switch tabs with staggered card entrance and a sliding indicator.\n"
          },
          "key": "rpc:switchTab(name, opts)"
        },

          "path": "moveTabIndicator()",
          "description": {
            "zh": "定位页签指示块，仅在可见时测量。\n",
            "en": "Position the tab indicator, measuring only when visible.\n"
          },
          "key": "rpc:moveTabIndicator()"

    "vrcnotifier.web.app.shell.theme": {
      "uid": "0717e08f",
      "id": "vrcnotifier.web.app.shell.theme",
      "parent": "vrcnotifier.web.app.shell",
      "tree": "vrcnotifier",
      "depth": 5,
      "name": {
        "zh": "主题切换",
        "en": "Theme Switching"
      },
      "description": {
        "zh": "主题切换在显式的浅色与深色之外还提供跟随系统，且“自动”真的跟随系统变化而不是只猜一次：系统偏好改变时会重新求值。选择持久化在内联头部脚本读取的同一个键上，因此正确主题在首帧前就已应用，面板永远不会闪一下错误的主题。\n",
        "en": "The theme switch offers auto alongside the explicit light and dark choices, and auto genuinely follows the operating system rather than being a one-time guess: it re-evaluates when the system preference changes. The choice is persisted under the same key the inline head script reads, so the correct theme is applied before first paint and the panel never flashes the wrong one.\n"
      },
      "source": [
        {
          "path": "public/app.js",
          "line": 2137,
          "end_line": 2157
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",

      "apis": [

          "protocol": "rpc",
          "path": "applyTheme(mode)",
          "description": {
            "zh": "应用自动/浅色/深色主题并持久化选择。\n",
            "en": "Apply auto, light or dark theme and persist the choice.\n"
          },
          "key": "rpc:applyTheme(mode)"
        },
        {
          "protocol": "rpc",
          "path": "cycleTheme()",
          "description": {
            "zh": "从顶部按钮顺序循环主题。\n",

    "vrcnotifier.web.app.smooth-scroll": {
      "uid": "f8da1d3d",
      "id": "vrcnotifier.web.app.smooth-scroll",
      "parent": "vrcnotifier.web.app",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "惯性平滑滚动",
        "en": "Inertial Smooth Scrolling"
      },
      "description": {
        "zh": "用惯性曲线替换浏览器默认滚轮滚动，使可能承载上千行的日志面板不会每滚一格就一顿。它还把这套缓动暴露为程序化滚动目标，使回到顶部与页签跳转的观感与手动滚动一致，而不是另一套内置动画。\n",
        "en": "Replaces the browser's default wheel scrolling with an inertial curve so the log panel, which can hold thousands of rows, does not jerk on every wheel notch. It also exposes the same easing as a programmatic scroll target so back-to-top and tab jumps move with the same feel as manual scrolling instead of a different built-in animation.\n"
      },
      "source": [
        {
          "path": "public/app.js",
          "line": 2308,
          "end_line": 2349
        }
      ],
      "revision": "2c5024302d3ef7a2eed227ff1c099afb401d6bcd",
      "updated_at": "2026-09-16T14:32:30.746Z",
      "fingerprint": "06609d43725c1483a940506f664ec39835212c390e7767362f17ac852efcc15d",
      "apis": [
        {
          "protocol": "rpc",
          "path": "initSmoothScroll()",
          "description": {
            "zh": "用指数趋近的惯性滚动替换默认滚轮。\n",
            "en": "Replace default wheel scrolling with exponential inertial easing.\n"
          },
          "key": "rpc:initSmoothScroll()"
        },
        {
          "protocol": "rpc",
          "path": "__smoothScrollTo(target)",
          "description": {
            "zh": "供回到顶部与页签跳转使用的程序化平滑滚动。\n",
            "en": "Programmatic smooth scroll used by back-to-top and tab jumps.\n"
          },
          "key": "rpc:__smoothScrollTo(target)"
        }
      ],
      "aggregate": {

    "vrcnotifier.web.app.sse-events": {
      "uid": "b6282e36",
      "id": "vrcnotifier.web.app.sse-events",
      "parent": "vrcnotifier.web.app",
      "tree": "vrcnotifier",
      "depth": 4,
      "name": {
        "zh": "SSE 事件订阅",
        "en": "SSE Event Subscription"
      },
      "description": {
        "zh": "事件流的客户端一半：每个会话一个 EventSource，按命名事件逐一绑定处理函数，覆盖日志及其就地更新、状态、健康、图表数据、登录进度、通知、快照、世界名、自身状态、QQ 状态、会话失效与两种 2FA 提示。由于一切都靠推送到达，整个面板里剩下的唯一轮询就是连接心跳。\n",
        "en": "The client half of the event stream: one EventSource per session with a handler per named event covering logs and their in-place updates, status, health, chart data, login progress, notifications, snapshots, world names, self state, QQ status, session expiry and the two 2FA prompts. Because everything arrives by push, the only polling left in the whole panel is the connection heartbeat.\n"
      },
      "source": [
        {
          "path": "public/app.js",
          "line": 1930,
          "end_line": 2005

      "depth": 5,
      "name": {
        "zh": "图表画布与数据流",
        "en": "Chart Canvas & Feed"
      },
      "description": {
        "zh": "图表锚定到墙上时间而非到达顺序，因此繁忙的事件循环漏掉一次 tick 也不会悄悄把整条序列错位：ticker 会重发最近几秒，客户端按秒幂等合并。渐变取自解析后的主题色而非硬编码，因此会跟随主题切换；面板不可见时绘制循环完全暂停。\n",
        "en": "The chart is anchored to wall-clock time rather than to arrival order, so a busy event loop that misses a tick cannot silently shift the whole series: the ticker re-sends the last few seconds and the client merges them idempotently by second. Gradients are read from resolved theme colours instead of hard-coded, so the chart follows theme switches, and the drawing loop pauses entirely when the panel is off-screen.\n"
      },

        "en": "The log panel's trimming policy, extracted so it can be unit tested without a browser. It is direction aware: in live mode new rows arrive at the top so the oldest rows at the bottom are trimmed, while when paging back through history rows are appended at the bottom and the newest rows at the top are trimmed. Either way the trimmed content is regenerable, from the backend by paging or from the live stream.\n"

        "zh": "为头像、昵称与世界名构造 VRChat 深链。标识来自服务端，因此写入属性前一律经严格白名单校验；不合法者退化为已转义的纯文本，而不是生成一个坏链。链接刻意用 span 加委托点击而非 a 元素：a 会获取焦点，而获得焦点的好友行会因 focus-within 样式一直保持高亮。\n",
        "en": "Builds the VRChat deep links for avatars, nicknames and world names. Identifiers arrive from the server, so each is validated against a strict whitelist before being placed in an attribute; anything that fails falls back to plain escaped text rather than emitting a broken link. Links are spans with a delegated click handler rather than anchors, deliberately: an anchor takes focus, and a focused friend row would stay highlighted through the focus-within style.\n"
      },

          "path": "userUrl(id)",
          "description": {
            "zh": "构造用户主页 URL，id 不合法则 null。\n",
            "en": "Build a user profile URL, or null for an invalid id.\n"
          },
          "key": "rpc:userUrl(id)"
        },
        {
          "protocol": "rpc",
          "path": "worldUrl(id)",
          "description": {
            "zh": "构造世界页 URL，哨兵或不合法 id 则 null。\n",
            "en": "Build a world page URL, or null for a sentinel or invalid id.\n"
          },
          "key": "rpc:worldUrl(id)"
        },
        {
          "protocol": "rpc",
          "path": "linkHtml(kind, id, text)",
          "description": {
            "zh": "为用户或世界渲染转义后的可点文本。\n",
            "en": "Render escaped, clickable text for a user or world.\n"
          },
          "key": "rpc:linkHtml(kind, id, text)"
        },
        {
          "protocol": "rpc",
          "path": "wrapHtml(kind, id, innerHtml)",
          "description": {
            "zh": "把已安全的 HTML 包一层可点区域。\n",
            "en": "Wrap already-safe HTML in a clickable region.\n"
          },
          "key": "rpc:wrapHtml(kind, id, innerHtml)"
        }
