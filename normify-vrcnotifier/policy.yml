# Normify 架构规则（policy.yml）：normify_validate 强制执行；规则类型与示例见 normify_policy_get。
schema_version: 1
updated_at: 2026-09-16T15:11:57.173Z
rules:
  - id: core-acyclic
    type: acyclic
    severity: error
    includeCrossTree: true
  - id: core-no-deprecated-target
    type: forbid-dependency
    from:
      - "**"
    to:
      - "**"
    toState: deprecated
    severity: warning
  - id: layer-order
    type: dependency-direction
    severity: error
    allowSameLayer: true
    layers:
      - name: app
        match:
          - vrcnotifier.app
          - vrcnotifier.app.**
      - name: server
        match:
          - vrcnotifier.server
          - vrcnotifier.server.**
      - name: monitor
        match:
          - vrcnotifier.monitor
          - vrcnotifier.monitor.**
      - name: integration
        match:
          - vrcnotifier.vrc
          - vrcnotifier.vrc.**
          - vrcnotifier.qq
          - vrcnotifier.qq.**
      - name: data
        match:
          - vrcnotifier.data
          - vrcnotifier.data.**
      - name: infra
        match:
          - vrcnotifier.infra
          - vrcnotifier.infra.**
      - name: web
        match:
          - vrcnotifier.web
          - vrcnotifier.web.**
  - id: depth-guard
    type: max-depth
    severity: warning
    maxDepth: 8
    scope:
      - vrcnotifier.**
