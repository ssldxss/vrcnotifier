# 本地联调: 单容器(面板 + API 同源), 使用已构建的本地镜像 + 自带密钥文件。
# 准备: cp <你的主密钥> secrets/master_key
# 运行: docker compose -f docker-compose.test.yml up -d
# 停止: docker compose -f docker-compose.test.yml down
services:
  vrcnotifier-backend:
    image: sihenglu/vrcnotifier-backend:latest
    container_name: vrcn-test-backend
    restart: no
    environment:
      PORT: "3000"
      SERVE_STATIC: "1"          # 面板与 API 同源(单容器)
      TZ: Asia/Shanghai
    volumes:
      - vrcn-test-data:/app/data
    secrets:
      - vrcnotifier_master_key
    ports:
      - "8090:3000"              # 浏览器入口: 面板 + API 同源
      - "127.0.0.1:3001:3000"    # 本机调试: 只监听回环
    networks: [vrcn-test]

secrets:
  vrcnotifier_master_key:
    file: ./secrets/master_key

volumes:
  vrcn-test-data:

networks:
  vrcn-test:
