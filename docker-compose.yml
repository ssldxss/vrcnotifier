# ============================================================
#  vrcnotifier 一键部署(两容器: 前端 nginx + 后端 Node API)
#
#  镜像(已发布到 Docker Hub):
#    sihenglu/vrcnotifier-frontend:latest   前端(nginx, 静态页 + /api 反代)
#    sihenglu/vrcnotifier-backend :latest   后端(API, 敏感数据 AES-256-GCM 加密)
#
#  使用(一键):
#    1) 放置主密钥文件(64 位十六进制 或 32 字节 base64, 行尾换行无碍):
#         cp <你的主密钥> secrets/master_key
#    2) docker compose up -d
#    3) 浏览器访问  http://<主机>:80     (端口可用 FRONTEND_PORT 覆盖)
#    停止:  docker compose down
#
#  说明:
#    - 前端对外 80 端口, 同源反代 /api 到后端(免 CORS); SSE 已关闭缓冲。
#    - 后端 SERVE_STATIC 关闭, 仅 API; 主密钥经 Docker Secret 注入
#      /run/secrets/vrcnotifier_master_key, 不写入镜像, 也不进环境变量(仅由 entrypoint 读文件后交给进程)。
#    - 主密钥必须与数据加密所用密钥一致: 若旧数据曾以密钥 X 加密, 这里必须用 X,
#      否则后端检测到"无法解密"会清空敏感数据(访问令牌保留)后退出重启。
# ============================================================
name: vrcnotifier

services:
  vrcnotifier-frontend:
    image: sihenglu/vrcnotifier-frontend:latest
    container_name: vrcnotifier-frontend
    restart: unless-stopped
    depends_on:
      vrcnotifier-backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: vrcnotifier-backend   # compose 服务名, 同网络内直接解析
      BACKEND_PORT: "3000"
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks: [vrcnet]

  vrcnotifier-backend:
    image: sihenglu/vrcnotifier-backend:latest
    container_name: vrcnotifier-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      SERVE_STATIC: ""        # API-only; 静态页由前端容器提供
      TZ: Asia/Shanghai
    volumes:
      - vrcn-data:/app/data
      # —— 可选: 复用已有数据目录(替代上行命名卷)——
      #   仅当确认 secrets/master_key 与该数据加密所用密钥一致时启用, 否则数据会被清空:
      # - ./data:/app/data
    secrets:
      - vrcnotifier_master_key
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [vrcnet]

secrets:
  vrcnotifier_master_key:
    file: ${MASTER_KEY_FILE:-secrets/master_key}

volumes:
  vrcn-data:

networks:
  vrcnet:
