# vrcnotifier 生产部署(Docker Desktop / WSL2 / Linux 服务器通用)
# 启动: docker compose up -d --build
# 查看日志(首次启动会打印访问令牌): docker compose logs -f
services:
  vrcnotifier:
    build: .
    image: vrcnotifier:latest
    container_name: vrcnotifier
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      SERVE_STATIC: "1"      # 后端同源托管前端页面(单容器开箱即用)
      TZ: Asia/Shanghai      # 日志/通知时间使用本地时区
      # 固定访问令牌(强烈建议): 不设置则首次启动自动生成, 从日志获取
      # ACCESS_TOKEN: "换成你自己的长随机串"
      # 可选调参(默认值见 src/index.js):
      # SNAPSHOT_INTERVAL_MS: "3600000"   # 周期对账间隔
      # WATCHDOG_MS: "3600000"            # 无消息强制重连阈值
      # WS_PING_INTERVAL_MS: "10000"
      # RECONNECT_MAX_MS: "3600000"
      # QQ_API_BASE: ""                   # QQ 接口地址覆盖
      # QQ_WS_URL: ""                     # QQ 网关地址覆盖
      # VRC_STATUS_URL: ""                # VRChat 状态页地址覆盖
    volumes:
      - vrcnotifier-data:/app/data      # 数据库 / 头像缓存 / vrcnotifier.log
      # 改用宿主机目录备份(需保证 uid 1000 可写, entrypoint 会自动 chown):
      # - ./data:/app/data

volumes:
  vrcnotifier-data:
