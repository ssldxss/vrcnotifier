# vrcnotifier 部署(单容器: 只带运行时环境, 每次启动从 GitHub 拉取最新源码)
# 构建并启动: docker compose up -d --build
# 日志: docker compose logs -f   (首次打印访问令牌; 每次启动都打印拉取的代码版本)
# 查看当前运行版本: curl -s http://localhost:3000/api/version
services:
  vrcnotifier:
    build: .
    image: vrcnotifier:latest
    container_name: vrcnotifier
    restart: unless-stopped
    ports:
      - "3000:3000"    # 后端 API
      - "8080:8080"    # 前端页面(独立进程; 门禁页填后端地址 http://服务器IP:3000)
    environment:
      TZ: Asia/Shanghai
      # ---- 启动时拉取的源码(默认见 Dockerfile, 可覆盖) ----
      # VRCN_REPO: "https://github.com/ssldxss/vrcnotifier.git"
      # VRCN_BRANCH: "main"
      # ---- 密钥: 主密钥 3 种方式(不自动生成), 见文件末尾与 README「密钥与加密」 ----
      #   生产: 下方 Docker Secret vrcnotifier_master_key(推荐)
      #   手动启动: 环境变量 MASTER_KEY(64位hex)
      #   研发模式: 两者都无 → 不加密启动(warn + 前端未加密提示)
      # 访问令牌无需配置: 只存数据库(首次启动自动生成, 日志打印一次)
      # VRCN_TOKEN: "GitHub PAT(未提供 secrets/git_token 时; 私有仓库/匿名限流才需要)"
      # ---- 可选调参(默认值见 src/index.js) ----
      # SNAPSHOT_INTERVAL_MS: "3600000"   # 周期对账间隔
      # WATCHDOG_MS: "3600000"            # 无消息强制重连阈值
      # WS_PING_INTERVAL_MS: "10000"
      # RECONNECT_MAX_MS: "3600000"
      # QQ_API_BASE: ""
      # QQ_WS_URL: ""
      # VRC_STATUS_URL: ""
    volumes:
      - vrcnotifier-data:/app/data    # 数据库 / 头像缓存 / vrcnotifier.log(源码在容器内, 每次启动重建, 无需卷)
      # 改用宿主机目录备份(需保证 uid 1000 可写, entrypoint 会自动 chown):
      # - ./data:/app/data
    secrets:
      - vrcnotifier_master_key        # 数据加密主密钥(AES-256-GCM)
      - vrcnotifier_git_token         # GitHub PAT(可选: 私有仓库/匿名限流)

# 主密钥 3 种方式(不自动生成): 1) 下方 Docker Secret(生产) 2) 环境变量 MASTER_KEY(手动启动)
# 3) 研发模式不加密(两者都未提供时自动降级); 访问令牌只存数据库, 无需配置。
# 文件放 ./secrets/ (已在 .gitignore, 永不进镜像/仓库), 挂载到容器 /run/secrets/<name>;
# required: false → 文件缺失不阻塞启动(降级到下一方式)。
# 生成(首次部署前):
#   mkdir -p secrets
#   openssl rand -hex 32 > secrets/master_key     # 数据加密主密钥
#   printf '%s' 'ghp_你的PAT' > secrets/git_token # GitHub PAT(可选)
#   chmod 600 secrets/*
# 主密钥丢失/更换环境(密文解不开): 后端会在启动时静默清空数据(保留访问令牌)并重启。
secrets:
  vrcnotifier_master_key:
    file: ./secrets/master_key
    required: false
  vrcnotifier_git_token:
    file: ./secrets/git_token
    required: false

volumes:
  vrcnotifier-data:
