# vrcnotifier 部署(单容器: 只带运行时环境, 每次启动从 GitHub 拉取最新源码)
# 构建并启动: docker compose up -d --build
# 日志: docker compose logs -f   (首次打印访问令牌; 每次启动都打印拉取的代码版本)
# 查看当前运行版本: curl -s http://localhost:3000/api/version
services:
  vrcnotifier:
    build: .
    image: vrcnotifier:latest
    container_name: vrcnotifier
    restart: unless-stopped
    ports:
      - "3000:3000"    # 后端 API
      - "8080:8080"    # 前端页面(独立进程; 门禁页填后端地址 http://服务器IP:3000)
    environment:
      TZ: Asia/Shanghai
      # ---- 启动时拉取的源码(默认见 Dockerfile, 可覆盖) ----
      # VRCN_REPO: "https://github.com/ssldxss/vrcnotifier.git"
      # VRCN_BRANCH: "main"
      # ---- 密钥: 主密钥 3 种方式, 见文件末尾与 README「密钥与加密」 ----
      #   生产: ./secrets 目录(下方挂载; 首次启动自动生成 master_key, 之后自动复用)
      #   手动启动: 环境变量 MASTER_KEY(64位hex; 提供时跳过自动生成)
      #   研发模式: --no-encrypt 手动不加密; 非容器环境(Windows 测试)无密钥时自动不加密启动
      # 访问令牌无需配置: 只存数据库(首次启动自动生成, 日志打印一次)
      # GitHub PAT: 放 ./secrets/git_token(可选; 私有仓库/匿名限流才需要)
      # ---- 可选调参(默认值见 src/index.js) ----
      # SNAPSHOT_INTERVAL_MS: "3600000"   # 周期对账间隔
      # WATCHDOG_MS: "3600000"            # 无消息强制重连阈值
      # WS_PING_INTERVAL_MS: "10000"
      # RECONNECT_MAX_MS: "3600000"
      # QQ_API_BASE: ""
      # QQ_WS_URL: ""
      # VRC_STATUS_URL: ""
    volumes:
      - vrcnotifier-data:/app/data    # 数据库 / 头像缓存 / vrcnotifier.log(源码在容器内, 每次启动重建, 无需卷)
      - ./secrets:/secrets           # 密钥目录(Docker secrets): 首次启动自动生成主密钥写回 ./secrets/master_key, 之后每次启动复用; git_token 放这里可选
      # 改用宿主机目录备份(需保证 uid 1000 可写, entrypoint 会自动 chown):
      # - ./data:/app/data

# 密钥目录 ./secrets/(已在 .gitignore, 永不进镜像/仓库), 绑定挂载进容器 /secrets, 兼容所有 compose 版本:
#   首次启动自动生成: ./secrets/master_key(0600); 之后每次启动自动复用同一把
#   也可手动预置: openssl rand -hex 32 > secrets/master_key(预置则直接用, 不再生成)
#   GitHub PAT(可选): printf '%s' 'ghp_你的PAT' > secrets/git_token
# 主密钥 3 种方式: 1) ./secrets 目录(生产) 2) 环境变量 MASTER_KEY(手动启动, 跳过生成)
# 3) 研发模式不加密(--no-encrypt 手动; Windows/本地无密钥时自动不加密启动)。访问令牌只存数据库, 无需配置。
# 主密钥丢失/更换环境(密文解不开): 后端会在启动时静默清空数据(保留访问令牌)并重启。
volumes:
  vrcnotifier-data:
