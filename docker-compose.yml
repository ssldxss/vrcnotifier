# ============================================================
#  vrcnotifier 一键部署(单容器自举版, 无需任何额外文件/命令)
#
#    docker compose up -d     # 一条命令: 首启自动生成主密钥 -> 起服务(面板 + API 同源)
#    默认端口: 3000 (API_PORT 可覆盖);  停止: docker compose down
#
#  镜像(已发布到 Docker Hub, 本机已缓存):
#    sihenglu/vrcnotifier-backend:latest
#      单一镜像同时提供 Web 面板与 REST/SSE API(同源, 免 CORS、免额外前端容器);
#      一次性 keygen 也复用此镜像, 不额外拉取。
#
#  主密钥(单文件方案如何做到"不交付密钥文件"):
#    - 首启由一次性容器 vrcn-keygen 在命名卷 vrcn-key 内随机生成 32 字节密钥, 不落 yaml、不落 host 文件。
#    - 密钥经卷挂载到 /run/secrets/vrcnotifier_master_key, entrypoint 以 root 读取后注入 MASTER_KEY 环境变量。
#    - vrcn-keygen 仅在卷内无密钥时生成; 之后每次启动复用同一把 -> 数据可正常解密。
#
#  ⚠️ 重要(务必知悉):
#    1) 停服勿用 `docker compose down -v`: 会连同删除 vrcn-key(密钥) 与 vrcn-data(数据) 两个卷。
#       密钥一旦丢失, 下次 up 会生成新密钥, 旧数据解不开 -> 被清空(仅访问令牌保留)。
#    2) 迁移"已有且已加密"的数据: 必须先把原密钥预置进 vrcn-key 卷、并改用原数据卷(见 DOCKER.md),
#       否则后端检测到"无法解密"会清空敏感数据(仅访问令牌保留)后退出重启。
#
#  使用:
#    docker compose up -d                            # 启动(默认 3000, API_PORT 可覆盖)
#    docker compose logs -f                          # 看日志
#    docker compose down                             # 停止(保留 vrcn-key / vrcn-data 卷)
#    docker compose pull && docker compose up -d     # 更新镜像(密钥与数据都在卷里, 不受影响)
#
#  访问: 浏览器开 http://<IP>:<端口>, 门禁页填访问令牌即可(后端地址自动预填同源)。
# ============================================================
name: vrcnotifier

services:
  # ── 一次性主密钥生成: 仅首启生成, 之后复用; 密钥写入命名卷 vrcn-key ──
  vrcn-keygen:
    image: sihenglu/vrcnotifier-backend:latest   # 复用主镜像(自带 node crypto), 无需额外拉取
    entrypoint: []
    command:
      - sh
      - -c
      - |
        K=/data/vrcnotifier_master_key
        if [ ! -s "$$K" ]; then
          node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))' > "$$K"
          chmod 600 "$$K"
          echo "vrcn-keygen: 已生成新的主密钥(32 字节)"
        else
          echo "vrcn-keygen: 检测到已有主密钥, 保持不变"
        fi
    volumes:
      - vrcn-key:/data
    network_mode: "none"
    restart: "no"

  # ── 面板 + API(同一 Node 进程、同一端口、同源)──
  vrcnotifier-backend:
    image: sihenglu/vrcnotifier-backend:latest
    restart: unless-stopped
    depends_on:
      vrcn-keygen:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      SERVE_STATIC: "1"       # 托管 public/ 静态页, 与 /api 同源(镜像默认已开, 这里显式声明)
      TZ: Asia/Shanghai
    volumes:
      - vrcn-key:/run/secrets   # 主密钥卷(来自 keygen): 落在 /run/secrets/vrcnotifier_master_key, entrypoint 以 root 读取
      - vrcn-data:/app/data     # 业务数据卷
      # —— 可选: 复用已有数据目录(替代上行命名卷)——
      #   仅当确认 vrcn-key 内密钥与该数据加密所用密钥一致时启用, 否则数据会被清空:
      # - ./data:/app/data
    ports:
      - "${API_PORT:-3000}:3000"   # 面板 + API 端口(同源, 只需这一个)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  vrcn-key:
  vrcn-data:
